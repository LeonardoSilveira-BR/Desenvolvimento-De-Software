<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Música</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <header>
        <h2>Trabalho Final</h2>
    </header>

    <div class="top">

        <button id="help">
            AJUDA
        </button>

        <div class="texto">

            <label for="texto">
                DIGITE/INSIRA O TEXTO:
            </label>

            <textarea
                id="texto"
                placeholder="Digite o texto aqui ou anexe um arquivo TXT">
            </textarea>

            <input
                type="file"
                id="arquivo"
                accept=".txt"
                hidden>

            <button id="anexar">
                ANEXAR ARQUIVO
            </button>

        </div>

    </div>

    <div class="config">

        <div class="campo">

            <label>INSTRUMENTO</label>

            <select id="instrumento">

                <option value="Piano">Piano</option>

                <option value="Violao">Violão</option>

                <option value="Violino">Violino</option>

                <option value="Guitarra">Guitarra</option>

                <option value="Baixo">Baixo</option>

                <option value="Bateria">Bateria</option>

            </select>

        </div>

        <div class="campo">

            <label>BPM</label>

            <select id="bpm">

                <option value="60">60</option>

                <option value="80">80</option>

                <option value="120" selected>120</option>

                <option value="140">140</option>

                <option value="180">180</option>

            </select>

        </div>

        <div class="campo">

            <label>OITAVA</label>

            <select id="oitava">

                <option value="2">2</option>

                <option value="3">3</option>

                <option value="4" selected>4</option>

                <option value="5">5</option>

                <option value="6">6</option>

            </select>

        </div>

        <div class="campo">

            <label>VOLUME</label>

            <input
                type="range"
                id="volume"
                min="0"
                max="100"
                value="80">

            <span id="valorVolume">
                80%
            </span>

        </div>

    </div>

    <div class="gerar">

        <button id="gerar">
            GERAR MÚSICA
        </button>

    </div>

    <div class="player">

        <button id="stop">
            <i class="fa-solid fa-stop"></i>
        </button>

        <button id="play">
            <i class="fa-solid fa-play"></i>
        </button>

        <button id="pause">
            <i class="fa-solid fa-pause"></i>
        </button>

        <button id="resume">
            <i class="fa-solid fa-rotate-right"></i>
        </button>

    </div>

    <div class="acoes">

        <button id="salvar">
            SALVAR
        </button>

        <button id="reiniciar">
            RETURN / REINICIAR
        </button>

        <button id="sair">
            SAIR
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
